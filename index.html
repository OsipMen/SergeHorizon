<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serge — VLESS Reality</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c10; --bg2:#12151c; --card:#161a23; --card-hover:#1c2230;
  --border:#232938; --text:#e4e7ec; --text-dim:#8b919e; --text-faint:#5c6270;
  --accent:#7c5cfc; --accent2:#5b8def; --uk:#3b82f6; --usa:#ef4444;
  --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.4);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5}
.container{max-width:1400px; margin:0 auto; padding:24px 16px 60px}
.header{text-align:center; padding:48px 16px 32px}
.header h1{
  font-size:clamp(2rem,6vw,3.2rem); font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:8px;
}
.header p{color:var(--text-dim); font-size:1.05rem}
.stats{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:24px 0 32px}
.stat{background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:12px 20px; display:flex; align-items:center; gap:10px}
.stat .num{font-size:1.5rem; font-weight:700; color:var(--accent)}
.stat .label{font-size:.85rem; color:var(--text-dim)}
.search-wrap{max-width:500px; margin:0 auto 32px; position:relative}
.search{width:100%; padding:14px 20px 14px 44px; font-size:1rem;
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  color:var(--text); outline:none; transition:border .2s}
.search:focus{border-color:var(--accent)}
.search-wrap::before{content:"🔍"; position:absolute; left:16px; top:50%;
  transform:translateY(-50%); font-size:1.1rem; opacity:.6}
.filters{display:flex; gap:8px; justify-content:center; margin-bottom:28px; flex-wrap:wrap}
.filter-btn{padding:8px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text-dim); cursor:pointer; font-size:.9rem;
  transition:all .2s; font-weight:500}
.filter-btn:hover{border-color:var(--accent); color:var(--text)}
.filter-btn.active{background:var(--accent); border-color:var(--accent); color:#fff}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; transition:all .25s; display:flex; flex-direction:column}
.card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow)}
.card-header{padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border)}
.card-name{font-size:1.05rem; font-weight:700; color:var(--text)}
.badge{padding:4px 12px; border-radius:20px; font-size:.75rem; font-weight:600}
.badge.uk{background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.3)}
.badge.usa{background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.3)}
.card-body{padding:20px; display:flex; flex-direction:column; align-items:center; gap:14px}
.qr-wrap{background:#fff; padding:12px; border-radius:12px; cursor:pointer; transition:transform .2s}
.qr-wrap:hover{transform:scale(1.03)}
.qr-wrap img{display:block; width:200px; height:200px}
.qr-label{font-size:.8rem; color:var(--text-faint); text-align:center}
.link-box{width:100%; background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:8px}
.link-text{flex:1; font-family:'SF Mono',Consolas,monospace; font-size:.72rem;
  color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.copy-btn{padding:6px 14px; background:var(--accent); color:#fff; border:none;
  border-radius:8px; font-size:.8rem; cursor:pointer; font-weight:600;
  transition:background .2s; white-space:nowrap}
.copy-btn:hover{background:#6b4cf0}
.copy-btn.copied{background:#22c55e}
.footer{text-align:center; padding:40px 16px; color:var(--text-faint); font-size:.85rem;
  border-top:1px solid var(--border); margin-top:40px}
.empty{text-align:center; padding:60px 20px; color:var(--text-faint)}
.modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:100; align-items:center; justify-content:center; cursor:pointer}
.modal.show{display:flex}
.modal img{max-width:90vw; max-height:85vh; background:#fff; padding:20px; border-radius:16px}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .qr-wrap img{width:170px; height:170px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Serge</h1>
    <p>Наведите камеру на QR-код в v2rayNG / Shadowrocket для подключения</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search-wrap">
    <input class="search" id="search" placeholder="Поиск по имени..." type="text">
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="UK">🇬🇧 UK</button>
    <button class="filter-btn" data-filter="USA">🇺🇸 USA</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Ничего не найдено</div>
</div>
<div class="modal" id="modal"><img id="modalImg" src="" alt="QR"></div>
<div class="footer">
  <p>VLESS • Reality • XTLS-Vision</p>
</div>
<script src="data.js"></script>
<script>
const D=LANDING_DATA; const users=D.users; const servers=D.servers;
const uk=users.filter(u=>u.server==='UK').length;
const usa=users.filter(u=>u.server==='USA').length;
document.getElementById('stats').innerHTML=[
  '<div class="stat"><span style="font-size:1.3rem">👥</span><span class="num">'+users.length+'</span><span class="label">подключений</span></div>',
  '<div class="stat"><span style="font-size:1.3rem">🇬🇧</span><span class="num">'+uk+'</span><span class="label">UK</span></div>',
  '<div class="stat"><span style="font-size:1.3rem">🇺🇸</span><span class="num">'+usa+'</span><span class="label">USA</span></div>'
].join('');
let cf='all', st='';
function esc(s){return s.replace(/'/g,"&#39;").replace(/"/g,'&quot;')}
function render(){
  const g=document.getElementById('grid');
  const f=users.filter(u=>{
    if(cf!=='all'&&u.server!==cf) return false;
    if(st&&!u.username.toLowerCase().includes(st.toLowerCase())) return false;
    return true;
  });
  document.getElementById('empty').style.display=f.length?'none':'block';
  g.innerHTML=f.map(u=>{
    const s=servers[u.server]; const cls=u.server==='UK'?'uk':'usa';
    return '<div class="card">'+
      '<div class="card-header">'+
        '<div class="card-name">'+esc(u.username)+'</div>'+
        '<span class="badge '+cls+'">'+s.flag+' '+u.server+'</span>'+
      '</div>'+
      '<div class="card-body">'+
        '<div class="qr-wrap" onclick="showQR(\''+u.qr+'\')">'+
          '<img src="data:image/png;base64,'+u.qr+'" alt="QR '+esc(u.username)+'">'+
        '</div>'+
        '<div class="qr-label">Наведите камеру для подключения</div>'+
        '<div class="link-box">'+
          '<div class="link-text" title="'+esc(u.vless)+'">vless://'+u.uuid.slice(0,8)+'...@'+s.host+':'+s.port+'</div>'+
          '<button class="copy-btn" onclick="copyText(\''+esc(u.vless)+'\',this)">Копировать</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function copyText(t,b){
  navigator.clipboard.writeText(t).then(()=>{
    const o=b.textContent; b.textContent='✓'; b.classList.add('copied');
    setTimeout(()=>{b.textContent=o; b.classList.remove('copied')},1500);
  });
}
function showQR(b){
  document.getElementById('modalImg').src='data:image/png;base64,'+b;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('modal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('search').oninput=e=>{st=e.target.value; render()};
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); cf=b.dataset.filter; render();
  };
});
render();
</script>
</body>
</html>
